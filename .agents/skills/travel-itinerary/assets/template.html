<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅のしおり</title>
<style>
  :root {
    --ink: #111111;
    --sub: #6b6b6b;
    --faint: #9a9a9a;
    --line: #e2e2e2;
    --soft: #f5f5f5;
    --paper: #ffffff;
    --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic", "YuGothic", Meiryo, sans-serif;
    --serif: var(--sans);
    --mono: var(--sans);
    --side: 288px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "palt";
  }
  a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  svg.i {
    width: 1.15em; height: 1.15em; flex: 0 0 auto;
    fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
    vertical-align: -0.2em;
  }

  /* ---- layout ---------------------------------------------------------- */
  .layout { min-height: 100vh; }

  header.hero {
    padding: calc(28px + env(safe-area-inset-top)) 22px 22px;
    border-bottom: 1px solid var(--ink);
  }
  .hero .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: .28em;
    text-transform: uppercase; color: var(--sub);
  }
  .hero h1 {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(26px, 7vw, 34px); line-height: 1.3;
    margin: 10px 0 14px; letter-spacing: .02em;
  }
  .hero .summary { font-family: var(--serif); color: var(--sub); margin: -6px 0 16px; }
  .hero ul.meta { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  .hero ul.meta li { display: flex; align-items: center; gap: 10px; }
  .hero ul.meta .mono { font-family: var(--mono); font-size: 13px; letter-spacing: .02em; }

  nav.tabs {
    position: sticky; top: 0; z-index: 10;
    display: flex; overflow-x: auto;
    background: rgba(255, 255, 255, .94);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 7px;
    border: 0; background: transparent; color: var(--sub);
    font: inherit; font-size: 14px;
    padding: 13px 16px 11px; cursor: pointer; white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  nav.tabs button .no { display: none; }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  nav.tabs button:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }

  main { padding: 26px 18px 48px; max-width: 1080px; }

  @media (min-width: 960px) {
    .layout {
      display: grid;
      grid-template-columns: var(--side) minmax(0, 1fr);
      grid-template-rows: auto 1fr;
    }
    header.hero {
      grid-column: 1; grid-row: 1;
      padding: 44px 28px 28px;
      border-bottom: 0;
    }
    header.hero h1 { font-size: 28px; }
    nav.tabs {
      grid-column: 1; grid-row: 2;
      align-self: start; top: 24px;
      flex-direction: column; overflow: visible;
      background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none;
      border-bottom: 0; border-top: 1px solid var(--ink);
      margin: 0 28px;
    }
    nav.tabs button {
      padding: 12px 4px; border-bottom: 1px solid var(--line);
      gap: 12px;
    }
    nav.tabs button .no { display: inline; font-family: var(--mono); font-size: 11px; color: var(--faint); width: 18px; }
    nav.tabs button[aria-selected="true"] { border-bottom-color: var(--line); }
    nav.tabs button[aria-selected="true"] .no { color: var(--ink); }
    nav.tabs button[aria-selected="true"]::after { content: ""; margin-left: auto; width: 18px; height: 1px; background: var(--ink); }
    main {
      grid-column: 2; grid-row: 1 / span 2;
      padding: 44px 48px 64px;
      border-left: 1px solid var(--line);
      max-width: none;
    }
    .layout > main > section, .layout > main > footer { max-width: 920px; }
  }

  /* ---- panels ---------------------------------------------------------- */
  section.panel { display: none; }
  section.panel.active { display: block; animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { section.panel.active { animation: none; } }

  .panel-head {
    display: flex; align-items: baseline; gap: 14px;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 10px; margin-bottom: 22px;
  }
  .panel-head .no { font-family: var(--mono); font-size: 12px; color: var(--sub); letter-spacing: .1em; }
  .panel-head h2 { font-family: var(--serif); font-weight: 600; font-size: 24px; margin: 0; letter-spacing: .04em; }

  .grid { display: grid; gap: 16px; }
  @media (min-width: 720px) {
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid .wide { grid-column: 1 / -1; }
  }

  .card { border: 1px solid var(--line); padding: 18px 18px 16px; background: var(--paper); }
  .card > h3 {
    display: flex; align-items: center; gap: 9px;
    font-size: 13px; font-weight: 600; letter-spacing: .08em;
    margin: 0 0 12px; color: var(--ink);
  }
  .card > h3 .count { margin-left: auto; font-family: var(--mono); font-weight: 400; color: var(--sub); }
  .muted { color: var(--sub); font-size: 13px; }
  .mono { font-family: var(--mono); }

  dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 18px; margin: 0; }
  dl.kv dt { color: var(--sub); font-size: 13px; padding-top: 1px; }
  dl.kv dd { margin: 0; overflow-wrap: anywhere; }

  ul.rows { list-style: none; margin: 0; padding: 0; }
  ul.rows > li { padding: 11px 0; border-top: 1px solid var(--line); }
  ul.rows > li:first-child { border-top: 0; padding-top: 2px; }
  ul.rows > li:last-child { padding-bottom: 0; }
  .row-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

  .tag {
    display: inline-block; font-size: 11px; line-height: 1.6; letter-spacing: .04em;
    border: 1px solid var(--ink); padding: 0 6px; color: var(--ink);
    vertical-align: 1px; white-space: nowrap;
  }
  .tag.ghost { border-color: var(--line); color: var(--sub); }

  a.link {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; letter-spacing: .04em; color: var(--ink);
    text-decoration: none; border-bottom: 1px solid var(--ink);
    padding-bottom: 1px; margin-top: 6px; margin-right: 14px;
  }
  a.link:hover { color: var(--sub); border-bottom-color: var(--sub); }
  a.link svg.i { width: 13px; height: 13px; }

  .notice {
    display: flex; gap: 10px; align-items: flex-start;
    border-left: 2px solid var(--ink); background: var(--soft);
    padding: 10px 14px; font-size: 13px; margin-bottom: 18px;
  }
  .notice svg.i { margin-top: 3px; }

  /* ---- day / timeline -------------------------------------------------- */
  .day { border: 1px solid var(--ink); margin-bottom: 18px; background: var(--paper); }
  .day-head {
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px;
    padding: 14px 18px; border-bottom: 1px dashed var(--ink);
  }
  .day-no { text-align: center; line-height: 1; padding-right: 16px; border-right: 1px solid var(--line); }
  .day-no small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .25em; color: var(--sub); }
  .day-no b { display: block; font-family: var(--serif); font-size: 34px; font-weight: 600; margin-top: 4px; }
  .day-title { font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .day-date { font-family: var(--mono); font-size: 13px; color: var(--sub); }
  .day-body { padding: 6px 18px 14px; }
  .day-note { font-size: 13px; color: var(--sub); padding: 10px 0 2px; }

  .day.is-rain { border-style: dashed; }
  .day-variant[hidden] { display: none; }
  .day-variant .variant-label { display: none; }

  .switch { display: inline-flex; border: 1px solid var(--ink); justify-self: start; }
  .switch button {
    display: inline-flex; align-items: center; gap: 6px;
    border: 0; background: var(--paper); color: var(--ink);
    font: inherit; font-size: 13px; padding: 5px 12px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .switch button + button { border-left: 1px solid var(--ink); }
  .switch button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .switch button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .day-head .switch { grid-column: 1 / -1; }
  @media (min-width: 560px) {
    .day-head { grid-template-columns: auto 1fr auto; }
    .day-head .switch { grid-column: auto; }
  }
  .weather-toggle { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; font-size: 13px; color: var(--sub); }

  ol.timeline { list-style: none; margin: 0; padding: 0; }
  ol.timeline li {
    position: relative;
    display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px;
    padding: 12px 0;
  }
  ol.timeline li::before {
    content: ""; position: absolute; left: 63px; top: 0; bottom: 0;
    width: 1px; background: var(--line);
  }
  ol.timeline li:first-child::before { top: 20px; }
  ol.timeline li:last-child::before { bottom: calc(100% - 20px); }
  ol.timeline li::after {
    content: ""; position: absolute; left: 59px; top: 16px;
    width: 9px; height: 9px; border: 1px solid var(--ink); background: var(--paper); border-radius: 50%;
  }
  ol.timeline li:first-child::after { background: var(--ink); }
  .tl-time { font-family: var(--mono); font-size: 13px; padding-top: 2px; letter-spacing: .02em; }
  .tl-body { padding-left: 12px; }
  .tl-title { font-weight: 600; }
  .tl-title .tag { margin-left: 8px; }
  .tl-place { font-size: 13px; color: var(--sub); }
  .tl-note { font-size: 14px; margin-top: 2px; }

  @media (min-width: 720px) {
    ol.timeline li { grid-template-columns: 64px minmax(0, 1fr); }
    ol.timeline li::before { left: 73px; }
    ol.timeline li::after { left: 69px; }
  }

  /* ---- spots ----------------------------------------------------------- */
  .spots { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .spot { border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 6px; }
  .spot .kicker { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: .1em; }
  .spot h3 { font-family: var(--serif); font-size: 18px; font-weight: 600; margin: 2px 0 0; }
  .spot p { margin: 0; font-size: 14px; }
  .spot .links { margin-top: auto; padding-top: 4px; }

  /* ---- articles -------------------------------------------------------- */
  .article-group + .article-group { margin-top: 28px; }
  .article-group > h3 { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; letter-spacing: .08em; margin: 0 0 10px; }
  .article-group > h3 .count { margin-left: auto; font-weight: 400; color: var(--sub); }
  ul.articles { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
  ul.articles li { border-bottom: 1px solid var(--line); }
  ul.articles a.article {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: start;
    padding: 14px 2px; text-decoration: none; color: var(--ink);
    transition: background .15s ease;
  }
  ul.articles a.article:hover { background: var(--soft); }
  ul.articles a.article:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .article .site { font-size: 12px; color: var(--sub); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .article .title { font-weight: 600; font-size: 15px; line-height: 1.5; }
  .article .sum { font-size: 13px; color: var(--sub); }
  .article > svg.i { grid-column: 2; grid-row: 1 / span 3; margin-top: 4px; }
  @media print {
    ul.articles a.article::after { content: attr(href); grid-column: 1; font-size: 11px; color: #000; overflow-wrap: anywhere; }
  }

  /* ---- weather --------------------------------------------------------- */
  .weather { display: grid; gap: 0; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); border-top: 1px solid var(--ink); border-left: 1px solid var(--line); margin-bottom: 18px; }
  .wday { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 16px 14px 14px; text-align: center; }
  .wday .date { font-family: var(--mono); font-size: 13px; }
  .wday svg.wi { width: 46px; height: 46px; margin: 10px auto 6px; display: block; fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .wday .sum { font-size: 13px; }
  .wday .temp { font-family: var(--mono); font-size: 15px; margin-top: 6px; }
  .wday .temp .lo { color: var(--sub); }
  .wday .meta { display: flex; justify-content: center; gap: 6px; align-items: center; font-size: 12px; color: var(--sub); margin-top: 4px; }
  .wday .meta svg.i { width: 13px; height: 13px; }

  /* ---- packing --------------------------------------------------------- */
  .progress { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; font-family: var(--mono); font-size: 12px; color: var(--sub); }
  .progress .bar { flex: 1; height: 2px; background: var(--line); position: relative; }
  .progress .bar span { position: absolute; inset: 0 auto 0 0; background: var(--ink); transition: width .25s ease; }
  .cat { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--sub); margin: 14px 0 2px; text-transform: uppercase; }
  .cat:first-of-type { margin-top: 0; }
  .check { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; cursor: pointer; border-bottom: 1px solid var(--soft); }
  .check input { position: absolute; opacity: 0; pointer-events: none; }
  .check .box {
    flex: 0 0 auto; width: 18px; height: 18px; margin-top: 3px;
    border: 1px solid var(--ink); display: grid; place-items: center;
    transition: background .15s ease;
  }
  .check .box svg.i { width: 13px; height: 13px; stroke: var(--paper); stroke-width: 2.4; opacity: 0; }
  .check input:checked + .box { background: var(--ink); }
  .check input:checked + .box svg.i { opacity: 1; }
  .check input:checked ~ .label { color: var(--faint); text-decoration: line-through; }
  .check input:focus-visible + .box { outline: 2px solid var(--ink); outline-offset: 2px; }
  .check .label .tag { margin-left: 8px; }

  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--faint); letter-spacing: .06em; }
  footer a { color: var(--sub); }

  @media print {
    nav.tabs, .no-print { display: none !important; }
    .layout { display: block; }
    header.hero { padding: 0 0 16px; }
    main { padding: 0; border: 0; }
    section.panel { display: block !important; animation: none !important; break-before: page; margin-top: 8px; }
    section.panel:first-of-type { break-before: auto; }
    .card, .day, .spot, .wday { break-inside: avoid; }
    .day-variant[hidden] { display: block !important; }
    .day-variant .variant-label { display: block; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #000; color: #000; }
    .check .box { border-color: #000; }
  }
</style>
</head>

    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.3v.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.01"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M7 17 17 7M8.5 7H17v8.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.5s-6 6.7-6 10.5a6 6 0 0 0 12 0c0-3.8-6-10.5-6-10.5z"/></symbol>
    <symbol id="i-shirt" viewBox="0 0 24 24"><path d="M8.5 3.5 3 6.5l2 4 2-1v11h10v-11l2 1 2-4-5.5-3a3.5 3.5 0 0 1-7 0z"/></symbol>
  </defs>
</svg>

<div class="layout">
  <header class="hero">
    <div class="eyebrow">Travel Itinerary</div>
    <h1 id="trip-title"></h1>
    <p class="summary" id="trip-summary" hidden></p>
    <ul class="meta" id="trip-meta"></ul>
  </header>
  <nav class="tabs" role="tablist" id="tabs" aria-label="しおりの目次"></nav>
  <main id="panels"></main>
</div>

<script type="application/json" id="itinerary-data">/*__ITINERARY_DATA__*/</script>
<script>
(function () {
  "use strict";

  var data = JSON.parse(document.getElementById("itinerary-data").textContent);
  var WEEK = ["日", "月", "火", "水", "木", "金", "土"];
  var SVG = "http://www.w3.org/2000/svg";

  // ---- helpers ----------------------------------------------------------
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (attrs[k] == null) return;
        if (k === "text") node.textContent = attrs[k];
        else if (k === "class") node.className = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) {
      if (c == null || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }
  function icon(name, cls) {
    var svg = document.createElementNS(SVG, "svg");
    svg.setAttribute("class", cls || "i");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("viewBox", "0 0 24 24");
    var use = document.createElementNS(SVG, "use");
    use.setAttribute("href", "#i-" + name);
    svg.appendChild(use);
    return svg;
  }
  function has(v) {
    if (v == null) return false;
    if (Array.isArray(v)) return v.length > 0;
    if (typeof v === "object") return Object.keys(v).some(function (k) { return has(v[k]); });
    return String(v).trim() !== "";
  }
  function parseDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function fmtDate(s) {
    var d = parseDate(s);
    if (!d) return s || "";
    return (d.getMonth() + 1) + "/" + d.getDate() + "（" + WEEK[d.getDay()] + "）";
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function yen(n, cur) { return Number(n).toLocaleString("ja-JP") + " " + (cur || "円"); }

  function link(href, label, iconName) {
    return el("a", { class: "link", href: href, target: "_blank", rel: "noopener" }, [label, icon(iconName || "external")]);
  }
  // links: [{ label, url }]。http(s) 以外は無視する
  function extLinks(links) {
    var list = (links || []).filter(function (l) { return l && safeUrl(l.url); });
    if (!list.length) return null;
    return el("div", null, list.map(function (l) { return link(l.url, l.label || "リンク"); }));
  }
  function mapLink(query) {
    if (!has(query)) return null;
    return link("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query), "地図", "pin");
  }
  function card(title, iconName, children, opts) {
    opts = opts || {};
    return el("div", { class: "card" + (opts.wide ? " wide" : "") }, [
      title ? el("h3", null, [iconName ? icon(iconName) : null, title,
        has(opts.count) ? el("span", { class: "count", text: opts.count }) : null]) : null
    ].concat(children));
  }
  function kv(pairs) {
    var dl = el("dl", { class: "kv" });
    pairs.forEach(function (p) {
      var v = p[1];
      if (!(v instanceof Node) && !has(v)) return;
      dl.appendChild(el("dt", { text: p[0] }));
      dl.appendChild(el("dd", null, [v instanceof Node ? v : String(v)]));
    });
    return dl;
  }
  function transportIcon(type) {
    var s = type || "";
    if (/飛行機|フライト|flight|plane|air/i.test(s)) return "plane";
    if (/新幹線|電車|列車|鉄道|特急|train|rail/i.test(s)) return "train";
    if (/バス|bus/i.test(s)) return "bus";
    if (/車|レンタカー|タクシー|car|taxi/i.test(s)) return "car";
    if (/船|フェリー|ferry|ship|boat/i.test(s)) return "ship";
    return "route";
  }
  var WEATHER = { sunny: "sun", partly: "partly", cloudy: "cloud", rain: "rain", snow: "snow", storm: "storm", fog: "fog" };
  function weatherIcon(d) {
    var c = String(d.condition || "").toLowerCase();
    if (WEATHER[c]) return WEATHER[c];
    var s = (d.icon || "") + (d.summary || "");
    if (/⛈|⚡|雷/.test(s)) return "storm";
    if (/❄|☃|🌨|雪/.test(s)) return "snow";
    if (/☔|☂|🌧|雨/.test(s)) return "rain";
    if (/🌫|霧/.test(s)) return "fog";
    var sun = /☀|🌤|⛅|🌥|晴/.test(s), cloud = /☁|🌤|⛅|🌥|曇|くもり/.test(s);
    if (sun && cloud) return "partly";
    if (sun) return "sun";
    if (cloud) return "cloud";
    return "partly";
  }

  function timeline(items) {
    return el("ol", { class: "timeline" }, (items || []).map(function (it) {
      return el("li", null, [
        el("div", { class: "tl-time", text: it.time || "" }),
        el("div", { class: "tl-body" }, [
          el("div", { class: "tl-title" }, [it.title || "", has(it.category) ? el("span", { class: "tag ghost", text: it.category }) : null]),
          has(it.place) ? el("div", { class: "tl-place", text: it.place }) : null,
          has(it.note) ? el("div", { class: "tl-note", text: it.note }) : null,
          mapLink(it.mapQuery)
        ])
      ]);
    }));
  }
  // 晴れ / 雨天 の切り替えボタン。onChange(true) で雨天
  function weatherSwitch(onChange) {
    var sunBtn = el("button", { type: "button", "aria-pressed": "true" }, [icon("sun"), "晴れ"]);
    var rainBtn = el("button", { type: "button", "aria-pressed": "false" }, [icon("umbrella"), "雨天"]);
    var node = el("div", { class: "switch no-print", role: "group", "aria-label": "晴れ・雨天のプラン切り替え" }, [sunBtn, rainBtn]);
    // rain: true=雨天 / false=晴れ / null=日によって違う（どちらも選択なし）
    node.set = function (rain) {
      sunBtn.setAttribute("aria-pressed", rain === false ? "true" : "false");
      rainBtn.setAttribute("aria-pressed", rain === true ? "true" : "false");
    };
    sunBtn.addEventListener("click", function () { onChange(false); });
    rainBtn.addEventListener("click", function () { onChange(true); });
    return node;
  }
  function variant(note, items, label) {
    return el("div", { class: "day-variant" }, [
      label ? el("div", { class: "variant-label day-note", text: label }) : null,
      has(note) ? el("div", { class: "day-note", text: note }) : null,
      timeline(items)
    ]);
  }
  // rainByDate: 日付 → 雨天プラン。ある日だけ 晴れ / 雨天 を切り替えられる
  function dayBlocks(days, rainByDate) {
    var setters = [], states = [], all = null;
    var syncAll = function () {
      if (!all) return;
      var rainy = states.filter(Boolean).length;
      all.set(rainy === 0 ? false : rainy === states.length ? true : null);
    };
    var blocks = days.map(function (day, i) {
      var rain = rainByDate[day.date];
      var sunTitle = day.title || (i + 1) + "日目";
      var title = el("div", { class: "day-title", text: sunTitle });
      var sunny = variant(day.note, day.items);
      var head = [
        el("div", { class: "day-no" }, [el("small", { text: "DAY" }), el("b", { text: pad(i + 1) })]),
        el("div", null, [el("div", { class: "day-date", text: [fmtDate(day.date), day.label].filter(has).join("　") }), title])
      ];
      var body = [sunny];
      var article = el("article", { class: "day" });
      if (rain) {
        var rainy = variant(rain.note, rain.items, "雨天時：" + (rain.title || "雨の日のプラン"));
        rainy.hidden = true;
        body.push(rainy);
        var sw, idx = states.length;
        states.push(false);
        var set = function (isRain) {
          states[idx] = isRain;
          sunny.hidden = isRain;
          rainy.hidden = !isRain;
          title.textContent = isRain ? (rain.title || "雨の日のプラン") : sunTitle;
          article.classList.toggle("is-rain", isRain);
          sw.set(isRain);
          syncAll();
        };
        sw = weatherSwitch(set);
        head.push(sw);
        setters.push(set);
      }
      article.appendChild(el("div", { class: "day-head" }, head));
      article.appendChild(el("div", { class: "day-body" }, body));
      return article;
    });
    if (setters.length) {
      all = weatherSwitch(function (isRain) {
        setters.forEach(function (f) { f(isRain); });
      });
      blocks.unshift(el("div", { class: "weather-toggle no-print" }, [
        all, el("span", { text: "雨天プランがある日（" + setters.length + "日）をまとめて切り替えます。日ごとにも切り替えられます。" })
      ]));
    }
    return blocks;
  }

  // ---- panels -----------------------------------------------------------
  var trip = data.trip || {};
  var panels = [];

  // 概要
  (function () {
    var c = [];
    if (has(trip.meeting)) {
      var mt = trip.meeting;
      c.push(card("集合", "flag", [kv([
        ["日時", [fmtDate(mt.date), mt.time].filter(has).join(" ")],
        ["場所", mt.place],
        ["メモ", mt.note]
      ]), mapLink(mt.mapQuery)], { wide: true }));
    }
    if (has(data.members)) {
      c.push(card("メンバー", "users", [el("ul", { class: "rows" }, data.members.map(function (m) {
        return el("li", null, [
          el("div", { class: "row-head" }, [m.name || "", has(m.role) ? el("span", { class: "tag", text: m.role }) : null]),
          has(m.note) ? el("div", { class: "muted", text: m.note }) : null
        ]);
      }))], { count: data.members.length + "人" }));
    }
    if (has(data.transport)) {
      c.push(card("移動", "route", [el("ul", { class: "rows" }, data.transport.map(function (t) {
        var route = [t.from, t.to].filter(has).join(" → ");
        var time = [t.depart, t.arrive].filter(has).join(" → ");
        return el("li", null, [
          el("div", { class: "row-head" }, [icon(transportIcon(t.type)), el("strong", { text: t.type || "" }), el("span", { class: "muted mono", text: fmtDate(t.date) })]),
          has(route) ? el("div", { text: route }) : null,
          has(time) ? el("div", { class: "mono muted", text: time }) : null,
          has(t.detail) ? el("div", { class: "muted", text: t.detail }) : null,
          extLinks(t.links)
        ]);
      }))]));
    }
    if (has(data.stays)) {
      c.push(card("宿泊", "bed", [el("ul", { class: "rows" }, data.stays.map(function (s) {
        return el("li", null, [
          el("div", { class: "row-head" }, [el("strong", { text: s.name || s.area || "" }), has(s.area) && has(s.name) ? el("span", { class: "tag ghost", text: s.area }) : null]),
          el("div", { class: "mono muted", text: [fmtDate(s.checkIn), fmtDate(s.checkOut)].filter(has).join(" → ") }),
          has(s.note) ? el("div", { class: "muted", text: s.note }) : null,
          el("div", null, [mapLink(s.mapQuery)].concat((s.links || []).filter(function (l) { return l && safeUrl(l.url); }).map(function (l) { return link(l.url, l.label || "リンク"); })))
        ]);
      }))]));
    }
    var b = data.budget;
    if (has(b)) {
      var rows = [];
      if (has(b.perPerson)) rows.push(["1人あたり", el("strong", { class: "mono", text: yen(b.perPerson, b.currency) })]);
      (b.breakdown || []).forEach(function (x) {
        rows.push([x.label, has(x.amount) ? el("span", { class: "mono", text: yen(x.amount, b.currency) }) : ""]);
      });
      rows.push(["メモ", b.note]);
      c.push(card("予算", "wallet", [kv(rows)]));
    }
    if (!c.length) {
      c.push(card("旅の概要", "map", [kv([["行き先", trip.destination], ["日程", fmtDate(trip.startDate) + " → " + fmtDate(trip.endDate)]])], { wide: true }));
    }
    panels.push({ id: "overview", label: "概要", icon: "map", children: [el("div", { class: "grid two" }, c)] });
  })();

  // 日程
  if (has(data.days)) {
    var rainByDate = {};
    (data.rainPlan || []).forEach(function (r) { if (r && r.date) rainByDate[r.date] = r; });
    panels.push({ id: "schedule", label: "日程", icon: "calendar", children: dayBlocks(data.days, rainByDate) });
  }

  // プラン
  if (has(data.spots)) {
    panels.push({ id: "plan", label: "プラン", icon: "pin", children: [el("div", { class: "spots" }, data.spots.map(function (s, i) {
      var url = safeUrl(s.url);
      return el("article", { class: "spot" }, [
        el("div", { class: "kicker" }, [el("span", { text: pad(i + 1) + (has(s.day) ? "　" + s.day : "") }), has(s.category) ? el("span", { class: "tag", text: s.category }) : null]),
        el("h3", { text: s.name || "" }),
        has(s.description) ? el("p", { text: s.description }) : null,
        el("div", { class: "links" }, [mapLink(s.mapQuery), url ? link(url, "Web サイト") : null])
      ]);
    }))] });
  }

  // 天気
  var w = data.weather;
  if (has(w) && has(w.days)) {
    var wc = [];
    var srcText = w.source === "forecast"
      ? "天気予報" + (has(w.checkedAt) ? "（" + w.checkedAt + " 時点）" : "") + "の内容です。出発前に最新の予報を確認してください。"
      : "その時期の平年の気候をもとにした目安です。出発前に最新の予報を確認してください。";
    wc.push(el("div", { class: "notice" }, [icon("info"), el("span", { text: srcText })]));
    wc.push(el("div", { class: "weather" }, w.days.map(function (d) {
      return el("div", { class: "wday" }, [
        el("div", { class: "date", text: fmtDate(d.date) }),
        icon(weatherIcon(d), "wi"),
        el("div", { class: "sum", text: d.summary || "" }),
        (has(d.high) || has(d.low)) ? el("div", { class: "temp" }, [
          has(d.high) ? d.high + "°" : "", has(d.high) && has(d.low) ? " / " : "",
          has(d.low) ? el("span", { class: "lo", text: d.low + "°" }) : null
        ]) : null,
        has(d.rainChance) ? el("div", { class: "meta" }, [icon("drop"), el("span", { class: "mono", text: d.rainChance + "%" })]) : null,
        has(d.clothing) ? el("div", { class: "meta" }, [icon("shirt"), el("span", { text: d.clothing })]) : null
      ]);
    })));
    var side = [];
    if (has(w.note)) side.push(card("服装・天気のメモ", "shirt", [el("div", { text: w.note })]));
    var links = (w.links || []).filter(function (l) { return safeUrl(l.url); });
    if (links.length) {
      side.push(card("最新の天気予報", "external", [el("ul", { class: "rows" }, links.map(function (l) {
        return el("li", null, [link(l.url, l.label || l.url)]);
      }))]));
    }
    if (side.length) wc.push(el("div", { class: "grid two" }, side));
    panels.push({ id: "weather", label: "天気", icon: "partly", children: wc });
  }

  // 持ち物
  var p = data.packing;
  if (has(p)) {
    var storeKey = "shiori-packing:" + (trip.title || "") + ":" + (trip.startDate || "");
    var state = {};
    try { state = JSON.parse(localStorage.getItem(storeKey) || "{}"); } catch (e) { state = {}; }
    var boxes = [];
    var barFill = el("span");
    var counter = el("span");
    var progress = el("div", { class: "progress no-print" }, [counter, el("div", { class: "bar" }, [barFill])]);
    var updateProgress = function () {
      var done = boxes.filter(function (b) { return b.checked; }).length;
      counter.textContent = done + " / " + boxes.length;
      barFill.style.width = (boxes.length ? done / boxes.length * 100 : 0) + "%";
    };
    var group = function (title, iconName, prefix, list, withAssignee) {
      if (!has(list)) return null;
      var cats = [], byCat = {};
      list.forEach(function (it) {
        var c = it.category || "その他";
        if (!byCat[c]) { byCat[c] = []; cats.push(c); }
        byCat[c].push(it);
      });
      var nodes = [];
      cats.forEach(function (c) {
        nodes.push(el("div", { class: "cat", text: c }));
        byCat[c].forEach(function (it, i) {
          var key = prefix + ":" + c + ":" + (it.item || i);
          var box = el("input", { type: "checkbox" });
          box.checked = !!state[key];
          box.addEventListener("change", function () {
            state[key] = box.checked;
            try { localStorage.setItem(storeKey, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
            updateProgress();
          });
          boxes.push(box);
          nodes.push(el("label", { class: "check" }, [box, el("span", { class: "box" }, [icon("check")]), el("span", { class: "label" }, [
            it.item || "",
            withAssignee && has(it.assignee) ? el("span", { class: "tag ghost", text: it.assignee }) : null,
            has(it.note) ? el("div", { class: "muted", text: it.note }) : null
          ])]));
        });
      });
      return card(title, iconName, nodes, { count: list.length + "点" });
    };
    var groups = [group("みんなで用意するもの", "users", "shared", p.shared, true), group("各自で用意するもの", "bag", "personal", p.personal, false)];
    updateProgress();
    panels.push({ id: "packing", label: "持ち物", icon: "bag", children: [progress, el("div", { class: "grid two" }, groups)] });
  }

  // メモ
  var n = data.notes;
  if (has(n)) {
    var nc = [];
    if (has(n.emergency)) nc.push(card("緊急連絡先", "alert", [kv(n.emergency.map(function (e) { return [e.label, e.value]; }))]));
    if (has(n.items)) nc.push(card("注意事項・メモ", "note", [el("ul", { class: "rows" }, n.items.map(function (t) { return el("li", { text: t }); }))]));
    panels.push({ id: "notes", label: "メモ", icon: "note", children: [el("div", { class: "grid two" }, nc)] });
  }

  // 参考ブログ
  var articles = (data.articles || []).filter(function (a) { return a && safeUrl(a.url) && has(a.title); });
  if (articles.length) {
    var aGroups = [], aBy = {};
    articles.forEach(function (a) {
      var g = has(a.about) ? a.about : "旅全体";
      if (!aBy[g]) { aBy[g] = []; aGroups.push(g); }
      aBy[g].push(a);
    });
    var ac = [el("div", { class: "notice" }, [icon("info"), el("span", { text: "行き先や行く場所について参考になる記事です。内容は書かれた時点のものなので、営業時間や料金は公式の情報で確認してください。" })])];
    aGroups.forEach(function (g) {
      ac.push(el("div", { class: "article-group" }, [
        el("h3", null, [icon(g === "旅全体" ? "map" : "pin"), g, el("span", { class: "count", text: aBy[g].length + "件" })]),
        el("ul", { class: "articles" }, aBy[g].map(function (a) {
          return el("li", null, [el("a", { class: "article", href: a.url, target: "_blank", rel: "noopener" }, [
            el("div", { class: "site" }, [
              has(a.site) ? el("span", { text: a.site }) : el("span", { text: a.url.replace(/^https?:\/\/([^/]+).*$/, "$1") }),
              has(a.kind) ? el("span", { class: "tag ghost", text: a.kind }) : null,
              has(a.publishedAt) ? el("span", { text: a.publishedAt }) : null
            ]),
            el("div", { class: "title", text: a.title }),
            has(a.summary) ? el("div", { class: "sum", text: a.summary }) : null,
            icon("external")
          ])]);
        }))
      ]));
    });
    panels.push({ id: "articles", label: "参考ブログ", icon: "book", children: ac });
  }

  // ---- render -----------------------------------------------------------
  document.title = (trip.title || "旅のしおり") + " | 旅のしおり";
  document.getElementById("trip-title").textContent = trip.title || "旅のしおり";
  if (has(trip.summary)) {
    var sm = document.getElementById("trip-summary");
    sm.textContent = trip.summary;
    sm.hidden = false;
  }
  var meta = document.getElementById("trip-meta");
  [
    ["pin", trip.destination, ""],
    ["calendar", fmtDate(trip.startDate) + " → " + fmtDate(trip.endDate), "mono"],
    ["users", has(data.members) ? data.members.length + "人" : "", ""]
  ].forEach(function (m) {
    if (has(m[1])) meta.appendChild(el("li", null, [icon(m[0]), el("span", { class: m[2], text: m[1] })]));
  });

  var tabs = document.getElementById("tabs");
  var main = document.getElementById("panels");
  var buttons = {}, sections = {};

  panels.forEach(function (pn, i) {
    var btn = el("button", { role: "tab", type: "button", "aria-controls": "panel-" + pn.id, id: "tab-" + pn.id },
      [el("span", { class: "no", text: pad(i + 1) }), icon(pn.icon), el("span", { text: pn.label })]);
    btn.addEventListener("click", function () { select(pn.id, true); });
    tabs.appendChild(btn);
    buttons[pn.id] = btn;
    var sec = el("section", { class: "panel", role: "tabpanel", id: "panel-" + pn.id, "aria-labelledby": "tab-" + pn.id }, [
      el("div", { class: "panel-head" }, [el("span", { class: "no", text: pad(i + 1) }), el("h2", { text: pn.label })])
    ].concat(pn.children));
    main.appendChild(sec);
    sections[pn.id] = sec;
  });
  main.appendChild(el("footer", null, ["Made with ", el("a", { href: "https://github.com/yoshimi-I/Travel_itinerary", target: "_blank", rel: "noopener", text: "Travel_itinerary" })]));

  function select(id, user) {
    if (!sections[id]) id = panels[0].id;
    Object.keys(sections).forEach(function (k) {
      sections[k].classList.toggle("active", k === id);
      buttons[k].setAttribute("aria-selected", k === id ? "true" : "false");
      buttons[k].tabIndex = k === id ? 0 : -1;
    });
    if (user) {
      if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
      buttons[id].scrollIntoView({ block: "nearest", inline: "nearest" });
      if (window.matchMedia("(max-width: 959px)").matches && tabs.getBoundingClientRect().top <= 0) {
        window.scrollTo({ top: tabs.offsetTop, behavior: "auto" });
      }
    }
  }
  tabs.addEventListener("keydown", function (e) {
    var ids = panels.map(function (pn) { return pn.id; });
    var cur = ids.indexOf(document.activeElement && document.activeElement.id.replace("tab-", ""));
    if (cur < 0) return;
    var next = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!next) return;
    e.preventDefault();
    var id = ids[(cur + next + ids.length) % ids.length];
    select(id, true);
    buttons[id].focus();
  });
  window.addEventListener("hashchange", function () { select(location.hash.slice(1), false); });
  select(location.hash.slice(1), false);
})();
</script>
</body>
</html>
