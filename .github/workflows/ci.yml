name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check that the sample itinerary is up to date
        run: |
          python .agents/skills/travel-itinerary/scripts/build.py examples/sample-trip.json examples/sample-trip.html
          if ! git diff --quiet -- examples/sample-trip.html; then
            echo "::error::examples/sample-trip.html が古くなっています。次を実行してコミットしてください:"
            echo "python3 .agents/skills/travel-itinerary/scripts/build.py examples/sample-trip.json examples/sample-trip.html"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check template JavaScript syntax
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path
          html = Path(".agents/skills/travel-itinerary/assets/template.html").read_text(encoding="utf-8")
          scripts = [s for s in re.findall(r"<script>(.*?)</script>", html, re.S)]
          assert scripts, "template.html にスクリプトがありません"
          Path("template-check.js").write_text("\n".join(scripts), encoding="utf-8")
          EOF
          node --check template-check.js

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh .agents/skills/travel-itinerary/scripts/check_update.sh

      - name: Install from the checkout, then uninstall
        run: |
          export HOME="$RUNNER_TEMP/home-local"
          ./install.sh
          test -f "$HOME/.claude/skills/travel-itinerary/SKILL.md"
          test -f "$HOME/.agents/skills/travel-itinerary/scripts/build.py"
          test -f "$HOME/.kiro/skills/travel-itinerary/references/schema.md"
          ./install.sh   # 2 回目は更新として動く
          ./install.sh --uninstall
          test ! -e "$HOME/.claude/skills/travel-itinerary"
          test ! -e "$HOME/.agents/skills/travel-itinerary"
          test ! -e "$HOME/.kiro/skills/travel-itinerary"

      - name: Install only the selected agents
        run: |
          export HOME="$RUNNER_TEMP/home-select"
          ./install.sh --codex --kiro
          test ! -e "$HOME/.claude/skills/travel-itinerary"
          test -f "$HOME/.agents/skills/travel-itinerary/SKILL.md"
          test -f "$HOME/.kiro/skills/travel-itinerary/SKILL.md"

      - name: Install through a pipe (like curl | bash)
        run: |
          export HOME="$RUNNER_TEMP/home-pipe"
          mkdir -p "$HOME"
          git archive --format=tar.gz --prefix=travel-itinerary-main/ HEAD -o "$RUNNER_TEMP/src.tar.gz"
          cd "$RUNNER_TEMP"
          TRAVEL_ITINERARY_ARCHIVE_URL="file://$RUNNER_TEMP/src.tar.gz" bash < "$GITHUB_WORKSPACE/install.sh"
          test -f "$HOME/.claude/skills/travel-itinerary/assets/template.html"
          python3 "$HOME/.claude/skills/travel-itinerary/scripts/build.py" "$GITHUB_WORKSPACE/examples/sample-trip.json" out/index.html

      - name: Update check
        run: |
          export HOME="$RUNNER_TEMP/home-update"
          ./install.sh --claude
          check="$HOME/.claude/skills/travel-itinerary/scripts/check_update.sh"
          stamp="$HOME/.claude/skills/travel-itinerary/.last-update-check"
          export TRAVEL_ITINERARY_VERSION_URL="file://$RUNNER_TEMP/remote-version"

          echo "999.0.0" > "$RUNNER_TEMP/remote-version"
          sh "$check" | grep -q "999.0.0"            # 新しいバージョンがあれば知らせる
          test -z "$(sh "$check")"                  # 1 日以内は確認しない

          rm "$stamp"
          cp .agents/skills/travel-itinerary/VERSION "$RUNNER_TEMP/remote-version"
          test -z "$(sh "$check")"                  # 同じバージョンなら何も出さない

          rm "$stamp"
          TRAVEL_ITINERARY_VERSION_URL="http://127.0.0.1:9/VERSION" sh "$check"   # つながらなくても失敗しない

          rm "$stamp"
          echo "999.0.0" > "$RUNNER_TEMP/remote-version"
          test -z "$(TRAVEL_ITINERARY_NO_UPDATE_CHECK=1 sh "$check")"   # 無効にできる

      - name: Refuse to overwrite a skill it did not install
        run: |
          export HOME="$RUNNER_TEMP/home-foreign"
          mkdir -p "$HOME/.claude/skills/travel-itinerary"
          touch "$HOME/.claude/skills/travel-itinerary/SKILL.md"
          if ./install.sh --claude; then echo "上書きしてしまった" && exit 1; fi
          test -f "$HOME/.claude/skills/travel-itinerary/SKILL.md"
