name: Release

# main の VERSION に、まだタグのないバージョンが書かれたら、タグ vX.Y.Z と GitHub Release を作る
on:
  push:
    branches: [main]
    paths:
      - .agents/skills/travel-itinerary/VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          version="$(head -n 1 .agents/skills/travel-itinerary/VERSION | tr -d '[:space:]')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION の形式が正しくありません: $version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create the tag and release if they do not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG はすでにリリース済みです"
            exit 0
          fi
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          previous="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" "${args[@]}"
